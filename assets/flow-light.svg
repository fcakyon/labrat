<svg xmlns="http://www.w3.org/2000/svg" width="980" height="160" viewBox="0 0 980 160" role="img" aria-labelledby="title desc"><title id="title">Lab Rat research loop</title><desc id="desc">Find papers, reproduce, design, launch, compare and publish, with compare looping back to design for the next experiment.</desc><defs><style>.hl{animation:walk 12s ease-in-out infinite}.loop{animation:loop 12s infinite}.loopt{animation:loopt 12s infinite}@keyframes walk{0%,7%{transform:translateX(0)}10%,17%{transform:translateX(166px)}20%,27%{transform:translateX(332px)}30%,37%{transform:translateX(498px)}40%,47%{transform:translateX(664px)}50%,57%{transform:translateX(332px)}60%,67%{transform:translateX(498px)}70%,77%{transform:translateX(664px)}80%,95%{transform:translateX(830px);opacity:1}99%{transform:translateX(830px);opacity:0}100%{transform:translateX(0);opacity:0}}@keyframes loop{0%,44%,56%,100%{stroke:#5f6368}47%,53%{stroke:#b84420}}@keyframes loopt{0%,44%,56%,100%{fill:#5f6368}47%,53%{fill:#b84420}}@media (prefers-reduced-motion:reduce){.hl{animation:none;transform:translateX(664px)}.loop,.loopt{animation:none}}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l8 4-8 4z" fill="#5f6368"/></marker></defs><g fill="none" stroke="#5f6368" stroke-width="1.5"><rect x="2" y="2" width="144" height="112" rx="6"/><rect x="168" y="2" width="144" height="112" rx="6"/><rect x="334" y="2" width="144" height="112" rx="6"/><rect x="500" y="2" width="144" height="112" rx="6"/><rect x="666" y="2" width="144" height="112" rx="6"/><rect x="832" y="2" width="144" height="112" rx="6"/><path d="M146 58.0h17" marker-end="url(#a)"/><path d="M312 58.0h17" marker-end="url(#a)"/><path d="M478 58.0h17" marker-end="url(#a)"/><path d="M644 58.0h17" marker-end="url(#a)"/><path d="M810 58.0h17" marker-end="url(#a)"/><path class="loop" d="M738.0 114V148H406.0V119" marker-end="url(#a)"/></g><rect class="hl" x="2" y="2" width="